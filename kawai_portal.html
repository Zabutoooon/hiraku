<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>河合塾ポータル</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f9;
      color: #202a35;
    }

    header {
      width: 100%;
      padding: 22px 16px;
      text-align: center;
      background: #174a7e;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    main {
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .portal-button {
      display: inline-block;
      padding: 18px 42px;
      border: none;
      border-radius: 12px;
      background: #174a7e;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 5px 0 #10365c;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .portal-button:hover {
      background: #205d98;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #10365c;
    }

    .portal-button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #10365c;
    }

    .portal-button:focus-visible {
      outline: 3px solid #f0b429;
      outline-offset: 5px;
    }
  </style>
</head>
<body>
  <header>河合塾ポータル</header>
  <main>
    <a
      class="portal-button"
      href="https://www.kawai-juku.ac.jp/zento/portal/"
      target="_blank"
      rel="noopener noreferrer"
    >ポータルを開く</a>
  </main>
</body>
</html>
